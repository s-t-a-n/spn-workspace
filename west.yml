manifest:
  remotes:
    - name: github
      url-base: https://github.com
    - name: github_ssh
      url-base: ssh://git@github.com
  projects:
    - name: zephyr
      remote: github
      repo-path: zephyrproject-rtos/zephyr
      revision: v3.7.1
      import:
        name-allowlist:
          - mbedtls
          - hal_nordic
          - hal_stm32
          - hal_espressif
          - cmsis
          - segger
    - name: etl
      remote: github
      repo-path: ETLCPP/etl
      revision: 20.41.6
      path: modules/lib/etl

